name: tailorlx_frontend
description: "TailorLX frontend application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  shared_preferences: ^2.2.0
  http: ^1.6.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^21.0.0
  geolocator: ^12.0.0
  # removed google_maps_flutter: using flutter_map (OpenStreetMap) for web/mobile
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geocoding: ^2.0.5
  image_picker: ^1.0.0
  url_launcher: ^6.1.10
  intl: ^0.20.0
  flutter_dotenv: ^5.0.2
  pusher_client_socket: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example
